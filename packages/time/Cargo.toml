[package]
name = "dioxus-sdk-time"
version = "0.7.0"

description = "Timing utilities and hooks for Dioxus."
readme = "./README.md"
keywords = ["gui", "dioxus", "hooks"]
categories = ["gui", "wasm"]

edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# On `wasm32` targets, wait on `wasi:clocks/monotonic-clock` (WASIp3) instead of
# `gloo-timers`. Intended for WebAssembly components, which have no JavaScript
# host to call `setTimeout` on. Has no effect on other targets.
wasip3 = ["dep:wasip3"]

[dependencies]
dioxus = { workspace = true, features = ["hooks", "signals"] }
futures = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["time"]}

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3 = { version = "0.8.0", optional = true, default-features = false, features = ["std"] }
